# ─────────────────────────────────────────────────────────────────────
#  SachchaSauda Broker — production nginx config
#  Live at /etc/nginx/sites-available/saudasaacha on the origin host.
#  scripts/deploy.sh syncs this file when it changes between commits.
#
#  Cloudflare is in front of all four hostnames (DNS Proxied, orange
#  cloud). Every block listens on BOTH :80 and :443 so the site works
#  whatever SSL mode the zone is on:
#    Flexible      → edge hits :80
#    Full          → edge hits :443, accepts our self-signed origin cert
#    Full (strict) → edge hits :443, needs a REAL cert — swap the two
#                    ssl_certificate paths for a Cloudflare Origin
#                    Certificate and reload. Nothing else changes.
#  A new Cloudflare zone defaults to Full, so :443 must exist or every
#  request dies with a 522 (origin connection timed out).
# ─────────────────────────────────────────────────────────────────────

# Connection upgrade map — "upgrade" only when client requests WebSocket,
# else "close". Without this, normal HTTP requests (CORS preflight OPTIONS)
# hang because nginx sends Connection: upgrade to backend, confusing uvicorn.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── sachchasauda.com / www → user Next.js (3000) ────────────────────────
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/ssl/saudasaacha/origin.crt;
    ssl_certificate_key /etc/ssl/saudasaacha/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name sachchasauda.com www.sachchasauda.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS; Next.js / FastAPI must believe the
        # client used HTTPS so generated URLs / cookies use the https
        # scheme. Without this `req.url` reads http:// and Set-Cookie
        # Secure-only cookies get rejected by the browser.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# ── admin.sachchasauda.com → admin Next.js (3001) ───────────────────────
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/ssl/saudasaacha/origin.crt;
    ssl_certificate_key /etc/ssl/saudasaacha/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name admin.sachchasauda.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# ── api.sachchasauda.com → FastAPI (8000) + WebSocket ───────────────────
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/ssl/saudasaacha/origin.crt;
    ssl_certificate_key /etc/ssl/saudasaacha/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name api.sachchasauda.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
